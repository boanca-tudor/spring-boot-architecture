[versions]
java = "21"

spring-boot = "4.0.6"
spring-cloud = "2025.1.1"

dependency-management = "1.1.7"

postgres = "42.7.8"
flyway = "11.14.1"
lombok = "1.18.42"

[libraries]
# Spring
spring-web = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# Spring Cloud
openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }

# Database
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Tests
spring-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Gradle plugins exposed as libraries for build-logic
spring-boot-gradle-plugin = { module = "org.springframework.boot:org.springframework.boot.gradle.plugin", version.ref = "spring-boot" }

dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }

[bundles]
common = [
    "spring-validation",
    "spring-actuator",
    "flyway-core",
    "flyway-postgres"
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }